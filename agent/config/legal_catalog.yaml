  - {key: "6-4", label: "第六条（四）", category: 6, title: "客户端已操作但后台未完成", gap: "需后台数据删除审计证据，客户端不可独立取证"}
  - {key: "6-5", label: "第六条（五）", category: 6, title: "未公布或未处理投诉举报"}
