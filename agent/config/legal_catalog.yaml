# 《App违法违规收集使用个人信息行为认定方法》31 项情形目录
# 只登记法条本身与缺口原因（稳定、人工维护）；规则覆盖、证据要求、
# 统计由 scripts/generate_coverage_audit.py 从规则库推导后生成。
# gap 仅用于当前没有自动规则的条款，说明为什么不能自动定性。
version: 1
source: "国信办秘字〔2019〕191号"
clauses:
