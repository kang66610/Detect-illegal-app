  - {key: "3-7", label: "第三条（七）", category: 3, title: "欺骗、误导用户同意"}
  - {key: "3-8", label: "第三条（八）", category: 3, title: "未提供撤回同意途径"}
  - {key: "3-9", label: "第三条（九）", category: 3, title: "违反已声明规则收集使用", gap: "需政策结构化声明与动态行为逐项比对，当前无自动规则"}
  - {key: "4-1", label: "第四条（一）", category: 4, title: "收集类型/权限与业务功能无关"}
  - {key: "4-2", label: "第四条（二）", category: 4, title: "拒绝非必要信息后拒绝服务"}
  - {key: "4-3", label: "第四条（三）", category: 4, title: "新功能扩大收集范围且拒绝则影响原功能", gap: "需版本/功能变更前后对比，依赖服务端或人工核验"}
  - {key: "4-4", label: "第四条（四）", category: 4, title: "收集频次超过实际需要"}
