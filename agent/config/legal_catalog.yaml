  - {key: "1-3", label: "第一条（三）", category: 1, title: "规则访问需超过 4 次点击"}
  - {key: "1-4", label: "第一条（四）", category: 1, title: "规则难以阅读", gap: "需 OCR + 字号/颜色/语言可读性分析，当前无自动规则"}
