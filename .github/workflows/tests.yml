name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.17.3

      # 只卡“真正会崩”的静态问题。F401 在本仓库有大量有意为之的
      # facade re-export，交给 check_import_contracts.py 判断，不交给 ruff。
      - name: Static checks (undefined names, redefinitions, dead locals)
        run: ruff check agent backend worker scripts --select F821,F811,F841,E9

      # 删未使用导入时最容易打断别处的 re-export，这条先于测试跑。
      - name: Import contract
        run: python scripts/check_import_contracts.py

      # 覆盖审计文档必须与规则库/证据链同源，手改过的数字在这里会被抓出来。
      - name: Coverage audit is in sync with code
        run: python scripts/generate_coverage_audit.py --check

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      # 把失败用例名写成 annotation，这样不用登录也能从 API 定位问题；
      # 同时保留完整日志给需要看细节的人。
      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short > pytest.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR) " pytest.log | head -20 | sed 's/^/::error::/' || true
            echo "----- pytest output tail -----"
            tail -60 pytest.log
          else
            tail -3 pytest.log
          fi
          exit "$status"

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
